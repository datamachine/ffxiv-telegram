name: Publish

on:
  push:
    tags:
      - "v*"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Download Dalamud
        shell: bash
        run: |
          set -euo pipefail
          curl -L https://goatcorp.github.io/dalamud-distrib/latest.zip -o latest.zip
          unzip -q latest.zip -d dalamud
          echo "DALAMUD_HOME=$PWD/dalamud" >> "$GITHUB_ENV"

      - name: Restore dependencies
        run: dotnet restore

      - name: Validate stable tag and derive release variables
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "${GITHUB_REF_NAME}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Tag must match vX.Y.Z without zero-padded segments." >&2
            exit 1
          fi

          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          asset_name="FFXIVTelegram-${version}.zip"

          {
            echo "TAG=${tag}"
            echo "VERSION=${version}"
            echo "ASSET_NAME=${asset_name}"
          } >> "$GITHUB_ENV"

      - name: Build solution
        run: dotnet build FFXIVTelegram.sln -c Release -v minimal

      - name: Run test suite
        run: dotnet test tests/FFXIVTelegram.Tests/FFXIVTelegram.Tests.csproj -v minimal

      - name: Build plugin output
        run: dotnet build src/FFXIVTelegram/FFXIVTelegram.csproj -c Release -o artifacts/plugin-release -v minimal

      - name: Build release artifacts
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/release/build-release.sh --tag "$GITHUB_REF_NAME" --input artifacts/plugin-release --output artifacts/release

      - name: Validate release outputs
        shell: bash
        run: |
          set -euo pipefail
          [[ -f "artifacts/release/${ASSET_NAME}" ]] || {
            echo "Missing release archive: artifacts/release/${ASSET_NAME}" >&2
            exit 1
          }
          [[ -f "artifacts/release/repo.json" ]] || {
            echo "Missing release manifest: artifacts/release/repo.json" >&2
            exit 1
          }

      - name: Upload release asset
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "$VERSION" --notes ""
          gh release upload "$TAG" "artifacts/release/$ASSET_NAME" --clobber

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Stage Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/pages
          cp artifacts/release/repo.json artifacts/pages/repo.json
          touch artifacts/pages/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: artifacts/pages

      - name: Update shared pluginmaster
        env:
          GH_TOKEN: ${{ secrets.PLUGINS_REPO_PAT }}
        shell: bash
        run: |
          set -euo pipefail

          PLUGINS_REPO="datamachine/ffxiv-plugins"
          DOWNLOAD_URL="https://github.com/datamachine/ffxiv-telegram/releases/download/${TAG}/${ASSET_NAME}"

          git clone "https://x-access-token:${GH_TOKEN}@github.com/${PLUGINS_REPO}.git" /tmp/ffxiv-plugins

          unzip -p "$GITHUB_WORKSPACE/artifacts/release/${ASSET_NAME}" FFXIVTelegram.json > /tmp/manifest.json

          last_update="$(date -u +%s)"

          entry=$(jq -c --arg dl "$DOWNLOAD_URL" --arg lu "$last_update" \
            '. + {DownloadLinkInstall: $dl, DownloadLinkUpdate: $dl, DownloadLinkTesting: $dl, LastUpdate: ($lu | tonumber)}' \
            /tmp/manifest.json)

          cd /tmp/ffxiv-plugins

          if [[ "$(cat pluginmaster.json)" == "[]" ]]; then
            echo "[$entry]" > pluginmaster.json
          else
            internal_name=$(echo "$entry" | jq -r '.InternalName')
            jq --arg name "$internal_name" 'map(select(.InternalName != $name))' pluginmaster.json > /tmp/pluginmaster.json
            mv /tmp/pluginmaster.json pluginmaster.json
            jq --argjson entry "$entry" '. + [$entry]' pluginmaster.json > /tmp/pluginmaster.json
            mv /tmp/pluginmaster.json pluginmaster.json
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pluginmaster.json
          git commit -m "Update FFXIVTelegram to ${VERSION}" || echo "No changes to commit"
          git push

  deploy-pages:
    runs-on: ubuntu-latest
    needs: release
    concurrency:
      group: publish-pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deploy-pages.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy-pages
        uses: actions/deploy-pages@v4
